services:
  domain-asm:
    build: .
    container_name: domain-asm-osint
    environment:
      PORT: "5100"
      ENABLE_ACTIVE_SCAN: "true"
      ENABLE_NMAP: "true"
      ENABLE_TRACEROUTE: "true"
      ENABLE_INFRASTRUCTURE_TRACE: "true"
      SCAN_DEFAULT_TIMEOUT_MS: "25000"
      SCAN_DEFAULT_RATE_LIMIT_MS: "350"
      SCAN_MAX_HOSTS: "40"
      SCAN_MAX_PORTS: "30"
      SCAN_MAX_DEPTH: "30"
    ports:
      - "5100:5100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
